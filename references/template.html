<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TITLE_PLACEHOLDER · 理解地图</title>
<style>
:root{
  --cream:#FAF6EB;
  --paper:#F3EDDD;
  --forest:#1E3A24;
  --sky:#BCD8EE;
  --sage:#AFCDA8;
  --ink:#1A2018;
  --marker:#F5E08A;
  --brick:#B5482A;
  --correct:#2F7D46;
  --wrong:#B5482A;
  --font-display:"Archivo Black","Noto Sans SC","PingFang SC",sans-serif;
  --font-head:"Poppins","Noto Sans SC","PingFang SC",sans-serif;
  --font-body:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  --font-mono:"Roboto Mono","JetBrains Mono",monospace;
  --radius-pill:999px;
  --radius-card:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--cream);color:var(--ink);line-height:1.65}
a{color:var(--forest);text-decoration:underline;text-underline-offset:3px}
a:hover{color:var(--brick)}

/* Layout */
.layout{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{
  width:270px;min-width:270px;
  background:var(--forest);color:var(--cream);
  position:sticky;top:0;height:100vh;
  overflow-y:auto;
  padding:28px 22px;
  display:flex;flex-direction:column;
  gap:24px;
}
.sidebar .title{
  font-family:var(--font-display);
  font-size:1.1rem;line-height:1.35;
  color:var(--marker);
  word-break:break-word;
}
.sidebar .progress-box{
  background:rgba(255,255,255,0.08);
  border-radius:var(--radius-card);
  padding:14px 16px;
}
.sidebar .progress-label{
  font-size:0.8rem;
  opacity:0.7;
  margin-bottom:6px;
}
.sidebar .progress-bar-outer{
  height:6px;background:rgba(255,255,255,0.15);
  border-radius:var(--radius-pill);
  overflow:hidden;
  margin-bottom:4px;
}
.sidebar .progress-bar-inner{
  height:100%;background:var(--sage);
  border-radius:var(--radius-pill);
  transition:width .3s;
  width:0%;
}
.sidebar .progress-num{
  font-size:0.85rem;font-weight:600;
}
.sidebar nav{display:flex;flex-direction:column;gap:2px}
.sidebar nav a{
  color:var(--cream);
  text-decoration:none;
  font-size:0.82rem;
  padding:6px 10px;
  border-radius:8px;
  transition:background .15s;
  opacity:0.78;
}
.sidebar nav a:hover{background:rgba(255,255,255,0.1);opacity:1}

/* Main */
.main{
  flex:1;
  padding:40px 48px 80px 48px;
  max-width:820px;
}
.main section{margin-bottom:52px}

/* Card */
.card{
  background:var(--paper);
  border-radius:var(--radius-card);
  padding:24px 28px;
  margin-bottom:18px;
}
.card h3{
  font-family:var(--font-head);
  font-size:1.1rem;
  color:var(--forest);
  margin-bottom:12px;
}

/* Typography */
h2{
  font-family:var(--font-display);
  font-size:1.55rem;color:var(--forest);
  margin-bottom:6px;
  padding-bottom:8px;
  border-bottom:3px solid var(--sage);
}
h2 .num{
  display:inline-block;
  background:var(--forest);color:var(--cream);
  font-size:0.75rem;padding:2px 10px;
  border-radius:var(--radius-pill);
  margin-right:10px;
  vertical-align:middle;
}
.module-desc{font-size:0.92rem;color:#555;margin-bottom:18px}

/* Source citation */
.src-block{
  margin-top:10px;padding:10px 14px;
  background:#e9e6d8;
  border-left:4px solid var(--sage);
  border-radius:0 8px 8px 0;
  font-size:0.85rem;line-height:1.5;
}
.src-block .src-label{
  font-weight:700;color:var(--forest);
  font-size:0.75rem;text-transform:uppercase;
  letter-spacing:0.04em;
}
.src-block .src-text{color:#444;margin-top:2px}
.src-block .src-en{font-style:italic;color:#666;font-size:0.82rem}

/* Info type tags */
.tag{
  display:inline-block;
  font-size:0.7rem;font-weight:700;
  padding:2px 8px;border-radius:var(--radius-pill);
  margin-right:6px;
  letter-spacing:0.03em;
  text-transform:uppercase;
}
.tag-fact{background:var(--sky);color:#1a3a5c}
.tag-judgment{background:var(--marker);color:#5c4a10}
.tag-inference{background:#e8d5c4;color:#6b3a2a}
.tag-example{background:var(--sage);color:var(--forest)}

/* Background supplement */
.bg-supplement{
  background:#fff;
  border:2px dashed var(--sage);
  border-radius:var(--radius-card);
  padding:16px 20px;
  margin-bottom:18px;
}
.bg-supplement h4{
  font-size:0.85rem;color:var(--brick);
  margin-bottom:6px;
}
.bg-supplement .why{
  font-size:0.8rem;color:#666;
  margin-top:8px;
  padding-top:6px;
  border-top:1px dotted #ccc;
}

/* Misunderstanding */
.misunderstand{
  background:#fff5f0;
  border-radius:var(--radius-card);
  padding:18px 22px;
  margin-bottom:16px;
}
.misunderstand h4{color:var(--brick);margin-bottom:8px}
.misunderstand .line{margin-bottom:6px;font-size:0.9rem}

/* Concept card */
.concept-card{
  background:var(--paper);
  border-radius:var(--radius-card);
  padding:22px 26px;
  margin-bottom:18px;
}
.concept-card h4{
  font-family:var(--font-head);
  font-size:1rem;color:var(--forest);
  margin-bottom:8px;
}
.concept-card .rel{
  font-size:0.85rem;color:var(--brick);
  margin-top:10px;padding-top:8px;
  border-top:1px dotted #ccc;
}

/* Relation tags */
.rel-tag{
  display:inline-block;
  font-size:0.72rem;padding:2px 8px;
  border-radius:var(--radius-pill);
  margin-right:4px;margin-bottom:4px;
  background:var(--sky);color:#1a3a5c;
  font-weight:600;
}

/* Learning goals */
.goal-item{
  display:flex;align-items:flex-start;gap:12px;
  margin-bottom:12px;
}
.goal-num{
  flex-shrink:0;
  width:30px;height:30px;
  background:var(--forest);color:var(--cream);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:0.85rem;
}

/* Structure map */
.struct-node{
  background:var(--paper);
  border-radius:var(--radius-card);
  padding:14px 18px;
  margin-bottom:10px;
  border-left:5px solid var(--sage);
}
.struct-node.math{border-left-color:var(--sky)}
.struct-node.spec{border-left-color:var(--brick)}
.struct-node h4{font-size:0.95rem;margin-bottom:4px}
.struct-node .loc{font-size:0.78rem;color:#777;font-family:var(--font-mono)}
.struct-node .arrow-down{text-align:center;color:var(--sage);font-size:1.2rem;margin:2px 0}

/* Gap card */
.gap-card{
  background:var(--paper);
  border-radius:var(--radius-card);
  padding:16px 22px;
  margin-bottom:14px;
}
.gap-card h4{color:var(--forest);margin-bottom:6px}

/* ============ INTERACTIVE TASK STYLES ============ */
.task{
  background:#fff;
  border-radius:var(--radius-card);
  padding:22px 26px;
  margin-bottom:20px;
  border:2px solid #e8e5d8;
}
.task .q{
  font-weight:700;font-size:0.98rem;
  margin-bottom:12px;
  color:var(--ink);
}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.opt{
  display:block;width:100%;text-align:left;
  background:#f7f5ec;border:2px solid #ddd8c4;
  padding:10px 14px;border-radius:10px;
  cursor:pointer;
  font-size:0.9rem;font-family:var(--font-body);
  transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--sage);background:#f0f4ea}
.opt.selected{border-color:var(--forest);background:#e6efe0;font-weight:600}
.check{
  display:inline-block;
  background:var(--forest);color:#fff;
  border:none;padding:8px 22px;
  border-radius:var(--radius-pill);
  cursor:pointer;font-size:0.88rem;font-weight:600;
  margin-bottom:10px;
  transition:opacity .15s;
}
.check:hover{opacity:0.88}
.feedback{
  min-height:32px;padding:10px 14px;
  border-radius:10px;
  font-size:0.87rem;line-height:1.5;
  background:#f7f5ec;color:#888;
}
.feedback.ok{background:#e6efe0;color:var(--correct);font-weight:600}
.feedback.no{background:#fef0eb;color:var(--wrong);font-weight:600}
.feedback .src{
  display:block;margin-top:6px;
  font-size:0.8rem;font-weight:400;
  color:#666;font-style:italic;
}

/* Select-style matching */
.match-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;
  font-size:0.9rem;
}
.match-row .match-label{min-width:100px;font-weight:600}
.match-row select{
  padding:6px 10px;border-radius:8px;
  border:2px solid #ddd8c4;
  font-size:0.85rem;font-family:var(--font-body);
  background:#f7f5ec;
}

/* Wrong box */
.wrong-box{
  background:#fef0eb;
  border-radius:var(--radius-card);
  padding:16px 22px;
  margin-top:24px;
}
.wrong-box h4{color:var(--brick);margin-bottom:8px}
.wrong-box ul{list-style:none;padding:0}
.wrong-box li{
  padding:6px 0;border-bottom:1px dotted #e8d0c0;
  font-size:0.87rem;
}

/* Report */
.report-area{
  background:#fff;
  border-radius:var(--radius-card);
  padding:18px 24px;
  margin-top:18px;
}
.report-area h4{margin-bottom:8px}
.report-area pre{
  background:#f7f5ec;padding:12px 16px;
  border-radius:10px;font-size:0.82rem;
  white-space:pre-wrap;
  font-family:var(--font-mono);
  color:var(--ink);
}

/* Buttons */
.btn-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{
  display:inline-block;
  background:var(--forest);color:#fff;
  border:none;padding:8px 20px;
  border-radius:var(--radius-pill);
  cursor:pointer;font-size:0.85rem;font-weight:600;
}
.btn:hover{opacity:0.88}
.btn-outline{
  background:transparent;color:var(--forest);
  border:2px solid var(--forest);
}

/* Footer */
footer{
  margin-top:60px;padding-top:20px;
  border-top:2px solid var(--sage);
  font-size:0.82rem;color:#888;
  text-align:center;
  line-height:1.7;
}

/* Tip box */
.tip{
  background:var(--marker);
  border-radius:var(--radius-card);
  padding:14px 18px;
  font-size:0.88rem;
  margin-bottom:18px;
}
.tip strong{color:var(--brick)}

/* Mobile */
@media(max-width:768px){
  .layout{flex-direction:column}
  .sidebar{
    width:100%;min-width:unset;
    position:relative;height:auto;
    padding:20px 16px;gap:12px;
  }
  .sidebar nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .sidebar nav a{font-size:0.75rem;padding:4px 8px}
  .main{padding:24px 16px 60px 16px}
  .card,.concept-card,.task,.misunderstand{padding:16px 18px}
}
</style>
</head>
<body>
<div class="layout">

<!-- ============ SIDEBAR ============ -->
<aside class="sidebar">
  <div class="title">TITLE_PLACEHOLDER<br>理解地图</div>
  <div class="progress-box">
    <div class="progress-label">学习进度</div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="barFill"></div></div>
    <div class="progress-num" id="barNum">0 / 0</div>
  </div>
  <nav>

</footer>

</div>

<!-- ============ FIXED INTERACTION ENGINE ============ -->
<script>
(function(){
  "use strict";
  function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
  function selectedVals(t){return $all('.opt.selected',t).map(function(o){return o.getAttribute('data-val');}).sort();}
  function setFb(t,state,html){var fb=t.querySelector('.feedback');if(!fb)return;fb.className='feedback'+(state?(' '+state):'');fb.innerHTML=html;}
  function updateBar(){
    var all=$all('.task'),done=$all('.task[data-answered="1"]');
    var fill=document.getElementById('barFill'),num=document.getElementById('barNum');
    if(fill)fill.style.width=all.length?(done.length/all.length*100)+'%':'0%';
    if(num)num.textContent=done.length+' / '+all.length;
  }
  function renderWrong(){
    var box=document.getElementById('wrongBox');if(!box)return;
    var wrong=$all('.task[data-answered="1"][data-correct="0"]');
    if(!wrong.length){box.innerHTML='<li style="color:#888">还没有错题。答错的题会自动收集到这里。</li>';return;}
    box.innerHTML='';
    wrong.forEach(function(t){var li=document.createElement('li');li.textContent='【'+(t.getAttribute('data-task')||'')+'】'+(t.getAttribute('data-review')||'回到对应模块复习');box.appendChild(li);});
  }
  function check(t){
    var type=t.getAttribute('data-type'),ok=false;
    if(type==='selects'){
      var sels=$all('select.match',t),allok=true,empty=false;
      sels.forEach(function(s){if(!s.value)empty=true;if(s.value!==s.getAttribute('data-correct'))allok=false;});
      if(empty){setFb(t,'no','请先把每一项都选好再检查。');return;}
      ok=allok;
    }else{
      var sel=selectedVals(t);
      if(!sel.length){setFb(t,'no','请先选择一个选项再检查。');return;}
      var ans=(t.getAttribute('data-answer')||'').split(',').map(function(x){return x.trim();}).sort();
      ok=(sel.join('|')===ans.join('|'));
    }
    var body=ok?(t.getAttribute('data-ok')||'回答正确。'):(t.getAttribute('data-no')||'再想想。');
    var src=t.getAttribute('data-src');
    setFb(t,ok?'ok':'no',(ok?'✅ ':'❌ ')+body+(src?('<span class="src">'+src+'</span>'):''));
    t.setAttribute('data-answered','1');t.setAttribute('data-correct',ok?'1':'0');
    updateBar();renderWrong();
  }
  function genReport(){
    var box=document.getElementById('report');if(!box)return;
    var all=$all('.task'),done=$all('.task[data-answered="1"]'),right=$all('.task[data-answered="1"][data-correct="1"]');
    var lines=['=== 学习报告 ===','完成题目：'+done.length+' / '+all.length,'答对：'+right.length+' 题',''];
    var wrong=$all('.task[data-answered="1"][data-correct="0"]');
    if(wrong.length){lines.push('我答错的题（建议复习）：');wrong.forEach(function(t){lines.push('- '+(t.getAttribute('data-task')||'')+'：'+(t.getAttribute('data-review')||''));});}
    else{lines.push('暂无错题。');}
    box.textContent=lines.join('\n');
  }
  document.addEventListener('click',function(e){
    var c=e.target.closest?e.target:null;
    var opt=c&&e.target.closest('.opt');
    if(opt){var t=opt.closest('.task');if(!t)return;
      if(t.getAttribute('data-multi')==='true'){opt.classList.toggle('selected');}
      else{$all('.opt',t).forEach(function(o){o.classList.remove('selected');});opt.classList.add('selected');}
      return;}
    var btn=c&&e.target.closest('.check');
    if(btn){var tk=btn.closest('.task');if(tk)check(tk);return;}
    if(e.target&&e.target.id==='genReport'){genReport();return;}
    if(e.target&&e.target.id==='copyReport'){var r=document.getElementById('report');if(r&&navigator.clipboard)navigator.clipboard.writeText(r.textContent);return;}
  });
  function init(){updateBar();renderWrong();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
